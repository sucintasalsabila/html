<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect App</title>
  </head>
  <body>
    <section id="container" style="display: flex; height: 100vh; font-family: sans-serif">
      <!-- Sidebar -->
      <section id="navigation" style="background-color: white; width: 15%; border-right: 1px solid #ccc; padding: 20px;">
        <h1 style="text-align: center; font-size: 20px; margin-bottom: 20px;">Connect</h1>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button style="padding: 10px; background-color: black; color: white; border: none; border-radius: 5px; text-align: left;">👤 User</button>
          <button style="padding: 10px; background-color: transparent; border: none; text-align: left;">🗝️ Hak Akses</button>
          <button style="padding: 10px; background-color: transparent; border: none; text-align: left;">🔓 Logout</button>
        </div>
      </section>

      <!-- Main content -->
      <section id="content" style="background-color: white; width: 85%; padding: 20px; position: relative;">
        <input type="search" placeholder="Cari user" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px;" />

        <!-- User Cards -->
        <div style="border: 1px solid #ccc; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; margin-bottom: 10px;">
          <div>
            <div style="font-weight: bold;">Sucinta Salsabila</div>
            <div style="font-size: 12px; color: gray;">2313086@universitasmulia.ac.id</div>
            <div style="margin-top: 5px;">
              <span style="background: black; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px;">Admin</span>
              <span style="background: black; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px;">Employee</span>
            </div>
          </div>
          <div style="font-weight: bold;">Aktif</div>
        </div>

        <div style="border: 1px solid #ccc; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; margin-bottom: 10px;">
          <div>
            <div style="font-weight: bold;">Lintang</div>
            <div style="font-size: 12px; color: gray;">lintang@universitasmulia.ac.id</div>
            <div style="margin-top: 5px;">
              <span style="background: black; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px;">Employee</span>
            </div>
          </div>
          <div style="font-weight: bold;">Aktif</div>
        </div>

        <div style="border: 1px solid #ccc; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; margin-bottom: 10px;">
          <div>
            <div style="font-weight: bold;">Shafira</div>
            <div style="font-size: 12px; color: gray;">shafira@universitasmulia.ac.id</div>
            <div style="margin-top: 5px;">
              <span style="background: black; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px;">Employee</span>
            </div>
          </div>
          <div style="font-weight: bold;">Aktif</div>
        </div>

        <div style="border: 1px solid #ccc; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; margin-bottom: 10px;">
          <div>
            <div style="font-weight: bold;">Lebah Ganteng</div>
            <div style="font-size: 12px; color: gray;">lebahganteng@universitasmulia.ac.id</div>
            <div style="margin-top: 5px;">
              <span style="background: black; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px;">Employee</span>
            </div>
          </div>
          <div style="font-weight: bold;">Suspended</div>
        </div>

        <!-- Add Button -->
        <button style="position: absolute; bottom: 20px; right: 20px; background-color: #ddd; border: none; width: 50px; height: 50px; border-radius: 5px; font-size: 18px;">+</button>
      </section>
    </section>
  </body>
</html>
